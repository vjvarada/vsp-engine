# VSP Engine — Docker Compose
# FOR PLANNING PURPOSES ONLY — NOT FOR DIAGNOSTIC USE

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vsp
      POSTGRES_USER: vsp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vsp}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-vspengine}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Backend ─────────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Required}
      DATABASE_URL: postgresql+asyncpg://vsp:${POSTGRES_PASSWORD:-vsp}@postgres:5432/vsp
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-vspengine}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Required}
      MINIO_BUCKET: vsp-studies
      GPU_DEVICE: ${GPU_DEVICE:-cuda:0}
      MEDSAM2_BASE_URL: http://medsam2:8001
      TOTALSEG_LICENSE_KEY: ${TOTALSEG_LICENSE_KEY:-}
      LOG_LEVEL: INFO
    depends_on:
      - redis
      - postgres
      - minio
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    ports: ["8000:8000"]

  # CPU worker (concurrency=4) — scout, scan_qc, mesh tasks
  worker_cpu:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      celery -A app.tasks.celery_app.celery_app worker
      -Q cpu_queue
      --concurrency=4
      --loglevel=info
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Required}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-vspengine}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Required}
    depends_on: [redis, minio]

  # GPU worker (concurrency=1) — segment + refine only. NEVER run 2 GPU tasks concurrently.
  worker_gpu:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      celery -A app.tasks.celery_app.celery_app worker
      -Q gpu_queue
      --concurrency=1
      --loglevel=info
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Required}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-vspengine}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Required}
      GPU_DEVICE: ${GPU_DEVICE:-cuda:0}
    depends_on: [redis, minio]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  # MedSAM2 isolation service — SEPARATE torch==2.5.1 environment
  # DO NOT merge with main backend — incompatible PyTorch versions
  medsam2:
    build:
      context: ./docker/medsam2
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-vspengine}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Required}
      CUDA_VISIBLE_DEVICES: ${GPU_DEVICE_MEDSAM2:-0}
    depends_on: [minio]
    ports: ["8001:8001"]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  # ── Frontend / Reverse Proxy ─────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on: [backend]

volumes:
  redis_data:
  postgres_data:
  minio_data:

